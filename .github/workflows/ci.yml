name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "v1.5-*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Compile Python modules
        run: python -m compileall -q model simulator scripts

      - name: Parse YAML schedules and examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for folder in ["schedules", "examples", "data"]:
              for path in sorted(Path(folder).rglob("*.yaml")):
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"parsed {path}")
          PY

      - name: Run worked examples
        run: python scripts/run_examples.py

      - name: Run sector schedule expansion
        run: python scripts/run_sector_schedule_expansion.py

      - name: Run sector stress matrix
        run: python scripts/run_sector_stress_matrix.py

      - name: Run behavioural response simulation
        run: python scripts/run_behavioural_response_simulation.py

      - name: Run administrative compliance workflow
        run: python scripts/run_administrative_compliance_workflow.py

      - name: Run legislative architecture
        run: python scripts/run_legislative_architecture.py

      - name: Run executive dashboard
        run: python scripts/run_executive_dashboard.py

      - name: Run V1.5 release candidate pack
        run: python scripts/run_v1_5_release_candidate_pack.py

      - name: Run external review attack pack
        run: python scripts/run_external_review_attack_pack.py

      - name: Run V1.5 final RC integrity seal
        run: python scripts/run_v1_5_final_rc_integrity_seal.py

      - name: Run real data feasibility
        run: python scripts/run_real_data_feasibility.py

      - name: Run public data pilot
        run: python scripts/run_public_data_pilot.py

      - name: Run public data evidence map
        run: python scripts/run_public_data_evidence_map.py

      - name: Run public data consistency audit
        run: python scripts/run_public_data_consistency_audit.py

      - name: Run source locator verification pack
        run: python scripts/run_source_locator_verification_pack.py

      - name: Run red-team reviewer objections
        run: python scripts/run_red_team_reviewer_objections.py

      - name: Run public real data loader
        run: python scripts/run_public_real_data_loader.py

      - name: Run public data placeholder replacement map
        run: python scripts/run_public_data_placeholder_replacement_map.py

      - name: Run mock evidence workflow
        run: python scripts/run_evidence_workflow.py

      - name: Run secure ingestion controls
        run: python scripts/run_ingestion_controls.py

      - name: Run investment guardrails
        run: python scripts/run_investment_guardrails.py

      - name: Run fiscal trajectory
        run: python scripts/run_fiscal_trajectory.py

      - name: Run transition funding
        run: python scripts/run_transition_funding.py

      - name: Run payment interactions
        run: python scripts/run_payment_interactions.py

      - name: Run distributional scenarios
        run: python scripts/run_distributional_scenarios.py

      - name: Run household weighting
        run: python scripts/run_household_weighting.py

      - name: Run uncertainty ranges
        run: python scripts/run_uncertainty_ranges.py

      - name: Run reviewed scenarios
        run: python scripts/run_reviewed_scenarios.py

      - name: Run repository guardrails
        run: python scripts/run_repo_guardrails.py
