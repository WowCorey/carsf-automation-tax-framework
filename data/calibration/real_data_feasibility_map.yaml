external_review_routes:
  - {review_track: legal_reviewer, scope: [forbidden data, evidence boundaries, public source terms], main_reason: Confirm Build 27 loading does not create legal, privacy, or tax advice issues.}
  - {review_track: tax_reviewer, scope: [AAVA, ATO public sources, payroll tax, transfer pricing], main_reason: Prevent public tax tables being overread as real tax-payable support.}
  - {review_track: treasury_methods_reviewer, scope: [fiscal aggregates, Budget papers, PBO public material], main_reason: Prevent public fiscal documents being overread as official costing.}
  - {review_track: ato_methods_reviewer, scope: [ATO public aggregates, taxpayer-record boundary], main_reason: Keep ATO public data separate from ATO records, guidance, or audit methods.}
  - {review_track: privacy_reviewer, scope: [restricted data, forbidden repo data, household microdata], main_reason: Ensure no person-level or restricted data enters the repository.}
  - {review_track: statistical_methods_reviewer, scope: [aggregate sanity checks, household weighting, uncertainty], main_reason: Prevent public aggregates being overread as population estimates or confidence intervals.}
