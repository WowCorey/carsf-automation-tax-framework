map_id: carsf_v1_5_real_data_feasibility_calibration_intake_map
map_name: CARSF V1.5 Real Data Feasibility and Calibration Intake Map
status: feasibility_and_calibration_intake_map_only_no_real_data_loaded
non_claims:
  - This is a feasibility and calibration-intake map only. No real data has been loaded by this build. No calibration has occurred. Realistic placeholders are not real data and are not calibrated. Public-data candidates are not loaded datasets. Restricted-data requirements are not data access.
  - This is not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not economic validation, not welfare validation, not statistical validation, not operational readiness, not legal sufficiency, not official status, and does not determine actual tax payable.
  - This does not use taxpayer-level, firm-level confidential, household microdata, ABS DataLab, HILDA microdata, DSS/Services Australia records, ATO records, Treasury/PBO confidential material, or restricted government data.
  - This does not modify firm-level CARSF liability. It only maps data feasibility, placeholder provenance, restricted-data needs, forbidden repo data, and public-data pilot readiness.
data_status_taxonomy:
  - real_public_data_candidate
  - real_public_data_loaded
  - restricted_data_required
  - realistic_placeholder
  - synthetic_fixture
  - forbidden_repo_data
  - not_collected
  - external_review_required
access_class_taxonomy:
  - public_open
  - public_manual_download
  - public_api_available
  - licence_required
  - restricted_research_access
  - government_internal_only
  - confidential_or_prohibited
  - unknown
claim_level_taxonomy:
  - inventory_only
  - feasibility_only
  - sanity_check_only
  - placeholder_anchor_only
  - calibration_candidate_only
  - external_review_only
  - forbidden_for_model_use
x_common_must_not: &common_must_not
  - calibration completed
  - validation
  - official status
  - actual tax payable
  - operational readiness
x_review_tracks: &core_reviews
  - legal_reviewer
  - tax_reviewer
  - treasury_methods_reviewer
  - ato_methods_reviewer
  - statistical_methods_reviewer
