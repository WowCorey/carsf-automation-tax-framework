build_29_6_requirements:
  - Create a red-team reviewer objections pack over the public-data pilot, evidence map, consistency audit, and source-locator cards.
  - Keep every answer framed as objection handling only, not validation or approval.
  - Do not load new public data or replace placeholders.
build_30_requirements:
  - Package the feasibility map, public-data pilot, evidence map, consistency audit, and source-locator cards into a reviewer handoff bundle.
  - Keep source-locator cards as manual-review aids only.
  - Preserve the no calibration, no validation, no actual tax payable, no official status, and no firm-level liability modification boundaries.
