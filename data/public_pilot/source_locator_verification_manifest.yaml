pack_id: carsf_v1_5_public_data_source_locator_verification_pack
pack_name: CARSF V1.5 Public Data Source-Locator Verification Pack
status: source_locator_verification_pack_only
non_claims:
  - This is a source-locator verification pack only. No new data is loaded by this build. This does not externally verify source values, does not scrape public sources, and does not call external APIs. Ready for manual review does not mean reviewed and does not mean externally verified. This is not calibration; calibration has not been completed. Public data does not prove the model works. Realistic placeholders remain placeholders, realistic placeholders are not real data, realistic placeholders are not calibrated, source references are not loaded datasets, and restricted-data requirements are not data access. This is not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not PBO costing, not economic validation, not welfare validation, not statistical validation, not operational readiness, not legal sufficiency, and not official status. It does not determine actual tax payable, does not use taxpayer-level data, firm-level confidential data, household microdata, ABS DataLab, HILDA microdata, DSS/Services Australia records, ATO taxpayer records, Treasury/PBO confidential material, or restricted government data, and does not modify firm-level CARSF liability. It only packages locator metadata and manual-review checklists.
  - Locator cards are manual-review aids only; they are not source verified, not externally verified, not validation, not approval, and not calibration.
  - Loaded public value cards are copied from existing Build 27 extracts only and do not introduce new public values.
  - Source-reference-only cards are not counted as loaded public data.
  - Placeholder-anchor cards remain realistic placeholders and are not real data or calibrated values.
input_artifacts:
  - data/public_pilot/public_data_pilot_manifest.yaml
  - data/public_pilot/extracts/public_aggregate_extracts.yaml
  - data/public_pilot/placeholders/realistic_placeholder_anchors.yaml
  - data/public_pilot/digests/public_data_pilot_digests.json
  - data/public_pilot/reviewer_evidence_map_manifest.yaml
