release_id: carsf_v1_5_release_candidate_pack
release_name: CARSF V1.5 Release Candidate Pack
release_status: private_research_prototype_release_candidate_pack
release_date_placeholder: "2026-05-18 release-candidate packaging date"
non_claims:
  - This is a private research prototype and release-candidate pack only. It is not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not economic validation, not welfare advice, not statistical validation, not compliance scoring, not enforcement, not operational readiness, not legal sufficiency, not legislative readiness, not a readiness score, and not an official review pathway. It does not determine actual tax payable, does not use taxpayer-level data, firm-level confidential data, household microdata, restricted government data, confidential Treasury/PBO material, or unauthorised data, and does not modify firm-level CARSF liability.
  - The release-candidate pack only packages existing prototype reports, warnings, navigation, review blockers, and working-paper material for external review.
  - Suggested reviewer routing is review navigation only and is not an official process.
x_core_non_claims: &core_non_claims
  - not_legal_advice
  - not_tax_advice
  - not_ato_guidance
  - not_treasury_modelling
  - not_economic_validation
  - not_actual_tax_payable
  - not_real_data
x_common_must_not: &common_must_not
  - legal advice
  - tax advice
  - official status
  - readiness score
  - actual tax payable
x_reviewers_policy_technical: &reviewers_policy_technical
  - policy_reviewer
  - technical_reviewer
x_reviewers_legal_tax_methods: &reviewers_legal_tax_methods
  - legal_reviewer
  - tax_reviewer
  - treasury_methods_reviewer
  - ato_methods_reviewer
source_documents:
  - paper/CARSF_V1_5_WORKING.md
  - paper/executive_summary.md
  - paper/formula_reference.md
  - paper/glossary.md
  - paper/references.md
  - paper/export_notes.md
prototype_layers:
