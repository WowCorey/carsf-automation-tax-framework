    layer_name: V1.5 Release Candidate Pack
    layer_group: overview
    summary: Working-paper and release-document package that consolidates current prototype reports, non-claims, calibration blockers, and reviewer routing.
    primary_files:
      - model/carsf/release_candidate_pack.py
      - data/release/v1_5_release_manifest.yaml
      - scripts/run_v1_5_release_candidate_pack.py
      - release/v1_5_rc/RELEASE_NOTES.md
    primary_reports: []
    streamlit_pages:
      - simulator/pages/25_Executive_Dashboard.py
    status_labels:
      - prototype_only
      - generated_report_available
      - not_for_real_world_use
    non_claim_flags:
      - not_readiness_score
      - not_official_review_pathway
      - not_operational_readiness
      - not_legal_sufficiency
      - not_legislative_readiness
      - not_real_data
    calibration_blockers:
      - Release-candidate pack does not calibrate any model or validate any report.
    external_review_blockers:
      - All release contents require external review before any real policy, legal, tax, administrative, economic, welfare, or statistical use.
    must_not_be_used_for:
      - readiness score
      - official status
      - official review pathway
      - validation
    recommended_reviewer:
      - policy_reviewer
      - technical_reviewer
      - hostile_red_team_reviewer
