reviewer_routes:
  - reviewer: policy_reviewer
    layers: [release_candidate_pack, working_paper, executive_dashboard, reviewed_scenarios, status_risks_docs]
    reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md, reports/reviewed_scenarios.md]
    release_documents: [release/v1_5_rc/RELEASE_NOTES.md, release/v1_5_rc/REVIEWER_BRIEFING.md]
    main_reason: Policy reviewers should start with scope, boundaries, and display controls.
  - reviewer: technical_reviewer
    layers: [core_formula_model, worked_examples, secure_ingestion, repo_guardrails, executive_dashboard, final_rc_integrity_seal]
    reports: [reports/example_results.md, reports/repo_guardrails.md, reports/executive_dashboard.md, reports/v1_5_final_rc_integrity_seal.md]
    release_documents: [release/v1_5_rc/REPORT_MAP.md, release/v1_5_rc/FINAL_RC_INTEGRITY_SEAL.md]
    main_reason: Technical reviewers should inspect reproducibility, runners, report schemas, and guardrails.
  - reviewer: legal_reviewer
    layers: [legislative_architecture, administrative_workflow, payment_interactions, behavioural_response]
    reports: [reports/legislative_architecture.md, reports/administrative_compliance_workflow.md]
    release_documents: [release/v1_5_rc/NON_CLAIM_BOUNDARIES.md, release/v1_5_rc/EXTERNAL_REVIEW_ROUTING.md]
    main_reason: Legal reviewers should attack non-operative boundaries, powers, obligations, and attribution issues.
  - reviewer: tax_reviewer
    layers: [core_formula_model, sector_schedules, worked_examples, behavioural_response]
    reports: [reports/transfer_pricing_results.md, reports/sector_schedule_expansion.md]
    release_documents: [release/v1_5_rc/CALIBRATION_BLOCKERS.md]
    main_reason: Tax reviewers should focus on AAVA, addback previews, grouping, schedules, and liability boundaries.
  - reviewer: treasury_methods_reviewer
    layers: [fiscal_trajectory, transition_funding, investment_incidence, calibration_shell]
    reports: [reports/fiscal_trajectory.md, reports/transition_funding.md, reports/investment_guardrails.md]
    release_documents: [release/v1_5_rc/CALIBRATION_BLOCKERS.md]
    main_reason: Treasury methods reviewers should attack fiscal, incidence, and funding assumptions.
  - reviewer: ato_methods_reviewer
    layers: [administrative_workflow, evidence_workflow, secure_ingestion, repo_guardrails]
    reports: [reports/administrative_compliance_workflow.md, reports/mock_evidence_workflow.md, reports/secure_ingestion_controls.md]
    release_documents: [release/v1_5_rc/EXTERNAL_REVIEW_ROUTING.md]
    main_reason: ATO methods reviewers should inspect workflow boundaries without treating them as guidance.
  - reviewer: privacy_reviewer
    layers: [secure_ingestion, evidence_workflow, administrative_workflow, household_distributional]
    reports: [reports/secure_ingestion_controls.md, reports/mock_evidence_workflow.md]
    release_documents: [release/v1_5_rc/NON_CLAIM_BOUNDARIES.md]
    main_reason: Privacy reviewers should attack data boundaries and real-data exclusion.
  - reviewer: statistical_methods_reviewer
    layers: [household_distributional, household_weighting, uncertainty_ranges, reviewed_scenarios]
    reports: [reports/uncertainty_ranges.md, reports/reviewed_scenarios.md]
    release_documents: [release/v1_5_rc/CALIBRATION_BLOCKERS.md]
    main_reason: Statistical reviewers should attack representativeness, uncertainty, and suppression logic.
  - reviewer: economic_methods_reviewer
    layers: [investment_incidence, sector_stress_matrix, fiscal_trajectory]
    reports: [reports/investment_guardrails.md, reports/sector_stress_matrix.md]
    release_documents: [release/v1_5_rc/CALIBRATION_BLOCKERS.md]
    main_reason: Economic reviewers should attack incidence, sector stress, and fiscal assumptions.
  - reviewer: welfare_policy_reviewer
    layers: [transition_funding, payment_interactions, household_distributional, household_weighting]
    reports: [reports/payment_interactions.md, reports/distributional_scenarios.md]
    release_documents: [release/v1_5_rc/CALIBRATION_BLOCKERS.md]
    main_reason: Welfare reviewers should inspect payment interactions, eligibility boundaries, and household synthetic status.
  - reviewer: parliamentary_counsel_reviewer
    layers: [legislative_architecture, working_paper]
    reports: [reports/legislative_architecture.md]
    release_documents: [release/v1_5_rc/NON_CLAIM_BOUNDARIES.md, release/v1_5_rc/EXTERNAL_REVIEW_ROUTING.md]
    main_reason: Parliamentary Counsel review is external and the skeleton is non-operative only.
  - reviewer: hostile_red_team_reviewer
    layers: [behavioural_response, reviewed_scenarios, sector_stress_matrix, repo_guardrails, status_risks_docs]
    reports: [reports/behavioural_response_simulation.md, reports/reviewed_scenarios.md, reports/repo_guardrails.md]
    release_documents: [release/v1_5_rc/REVIEWER_BRIEFING.md]
    main_reason: Red-team review should challenge overclaims, stale manifests, and missing blockers.
calibration_blockers:
  - Formula, sector, AAVA, fiscal, payment, household, uncertainty, behavioural, administrative, legislative, and dashboard layers remain uncalibrated.
external_review_blockers:
  - Legal, tax, Treasury, ATO methods, privacy, economic, statistical, welfare, Parliamentary Counsel, technical, cybersecurity, and hostile review remain unresolved.
