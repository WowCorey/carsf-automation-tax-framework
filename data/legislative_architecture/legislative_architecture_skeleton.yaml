architecture_id: carsf_v1_5_legislative_architecture_skeleton
architecture_name: CARSF V1.5 Legislative Architecture Skeleton
status: non_operative_architecture_skeleton_only
non_claims:
  - This is a non-operative legislative architecture skeleton only. It is not operative law. It is not a Bill. It is not legal drafting. It is not legal advice. It is not tax advice. It is not ATO guidance. It is not Treasury modelling. It is not Parliamentary Counsel drafting. It is not legally sufficient and it has not been constitutionally reviewed. It creates no rights, obligations, statutory powers, information-gathering powers, notices, penalties, enforcement process, or compliance scoring. It does not determine tax payable, does not use taxpayer-level, firm-level, industry, ABS, ATO, DSS, Treasury, PBO, HILDA, or Census data, and does not modify firm-level CARSF liability.
  - The skeleton maps conceptual architecture only for external legal, tax, Treasury, ATO, Parliamentary Counsel, privacy, calibration, administrative-design, and policy review.
  - All Parts, Divisions, definitions, schedules, evidence placeholders, safeguards, regulation-making placeholders, and anti-avoidance placeholders are reserved for external drafting review before any real use.
