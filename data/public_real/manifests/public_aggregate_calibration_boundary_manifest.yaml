map_id: carsf_v1_5_public_aggregate_calibration_boundary_map
map_name: CARSF V1.5 Public Aggregate Calibration Boundary Map
status: public_aggregate_calibration_boundary_map_only
non_claims:
  - This is a public aggregate calibration-boundary map only. No new data is loaded by this build. Public aggregate data can support sanity checks, anchors, bounds, context, placeholder narrowing, or reviewer traceability only. Public aggregate data does not calibrate the model. Calibration has not been completed. Public data does not prove the model works. Boundary mapping does not mean validation, statistical estimation, legal sufficiency, or implementation readiness. Source candidates not loaded remain not loaded. Restricted-data blockers remain blockers. This is not validation, not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not PBO costing, not economic validation, not welfare validation, not statistical validation, not operational readiness, not legal sufficiency, and not official status. It does not determine actual tax payable and does not modify firm-level CARSF liability.
  - Build 33 uses Build 31 public aggregate values and Build 32 placeholder replacement decisions only; it does not add public values, scrape sources, call APIs, or load restricted, personal, taxpayer-level, firm-confidential, household microdata, ABS DataLab, HILDA, DSS / Services Australia, ATO taxpayer, confidential Treasury / PBO, bank, payroll-document, pay-record, or tax-file-identifier data.
  - Allowed-use labels are boundary labels only; they are not calibration, validation, legal sufficiency, official status, implementation readiness, or liability determinations.
