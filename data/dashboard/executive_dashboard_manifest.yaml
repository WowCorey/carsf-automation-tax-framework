dashboard_id: carsf_v1_5_executive_dashboard
dashboard_name: CARSF V1.5 Executive Dashboard Consolidation
status: prototype_dashboard_report_index_only
non_claims:
  - This is a prototype dashboard and report index only. It is not legal advice, tax advice, ATO guidance, Treasury modelling, economic validation, welfare advice, compliance scoring, enforcement, not operational readiness, not legal sufficiency, not legislative readiness, not a readiness score, and not an official review pathway. It does not determine actual tax payable, does not use taxpayer-level data, firm-level confidential data, household microdata, restricted government data, confidential Treasury/PBO material, or unauthorised data, and does not modify firm-level CARSF liability.
  - The dashboard only consolidates existing prototype reports, warnings, navigation, and review blockers.
  - Suggested review navigation is a reviewer convenience only and is not an official process.
x_must_not_core: &must_not_core
  - actual tax payable
  - legal advice
  - tax advice
  - ATO guidance
  - Treasury modelling
  - economic validation
  - operational readiness
x_must_not_household: &must_not_household
  - real household modelling
  - population estimate
  - welfare advice
  - eligibility law
  - statistical validation
x_must_not_admin: &must_not_admin
  - enforcement
  - notices
  - penalties
  - compliance scoring
  - official review pathway
x_reviewers_policy_technical: &reviewers_policy_technical
  - policy_reviewer
  - technical_reviewer
x_reviewers_legal_tax: &reviewers_legal_tax
  - legal_reviewer
  - tax_reviewer
  - treasury_methods_reviewer
  - ato_methods_reviewer
layers:
  - layer_id: executive_dashboard
    layer_name: Executive Dashboard
    layer_group: overview
    purpose: Consolidated navigation and report index for the CARSF V1.5 prototype stack.
    primary_files:
      - model/carsf/executive_dashboard.py
      - data/dashboard/executive_dashboard_manifest.yaml
      - scripts/run_executive_dashboard.py
    primary_reports: []
    streamlit_pages:
      - simulator/pages/25_Executive_Dashboard.py
    status_labels:
      - implemented_prototype
      - placeholder_only
      - not_for_real_world_use
    non_claim_flags:
      - not_legal_advice
      - not_tax_advice
      - not_ato_guidance
      - not_treasury_modelling
      - not_economic_validation
      - not_operational_readiness
      - not_legal_sufficiency
    calibration_blockers: []
    external_review_blockers:
      - Dashboard consolidation requires reviewer judgement and does not replace layer-specific review.
    blocker_explanation: This layer is navigation only and creates no score or approval.
    recommended_reviewer:
      - policy_reviewer
      - technical_reviewer
    read_order: 1
    main_reason: Reviewers should start with the dashboard to find reports and boundary warnings.
    must_not_be_used_for:
      - readiness score
      - maturity score
      - official review pathway
      - validation
