      - placeholder_only
      - calibration_required
      - not_for_real_world_use
    non_claim_flags:
      - not_actual_tax_payable
      - not_tax_advice
      - not_ato_guidance
      - not_treasury_modelling
    calibration_blockers:
      - OPFTE, FRV, caps, rates, and schedule coefficients require external calibration.
    external_review_blockers:
      - Tax, Treasury, ATO methods, and legal review are required before any real use.
    blocker_explanation: Core formula outputs are prototype calculations only.
    recommended_reviewer: *reviewers_legal_tax
    read_order: 5
    main_reason: Formula concepts are central but remain placeholder and non-operative.
    must_not_be_used_for: *must_not_core
