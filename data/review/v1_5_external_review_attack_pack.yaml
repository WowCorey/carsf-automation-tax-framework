attack_pack_id: carsf_v1_5_external_review_attack_pack
attack_pack_name: CARSF V1.5 External Review Attack Pack
status: prototype_external_review_attack_pack_only
non_claims:
  - This is an attack pack for external review. It does not mean external review has been completed, does not mean approval has been granted, does not mean validation has occurred, is not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not economic validation, not welfare validation, not statistical validation, not compliance scoring, not enforcement, not operational readiness, not legal sufficiency, not legislative readiness, not a readiness score, not official status, and not an official review pathway. It does not determine actual tax payable, does not use taxpayer-level, firm-level, industry, ABS, ATO, DSS, Treasury, PBO, HILDA, or Census data, and does not modify firm-level CARSF liability.
  - The attack pack only structures questions, challenges, failure modes, boundary checks, and review routes for external reviewers.
  - Challenge severity labels are not risk scores, not validation outcomes, not approval statuses, and not readiness ratings.

x_common_non_claims: &common_non_claims
  - This attack track does not mean external review has been completed, does not mean approval has been granted, and does not mean validation has occurred.
  - It is not legal advice, not tax advice, not ATO guidance, not Treasury modelling, not economic validation, not welfare validation, not statistical validation, not compliance scoring, not enforcement, and does not modify firm-level CARSF liability.
x_common_must_not: &common_must_not
  - Do not infer completed external review.
  - Do not infer approval, validation, operational readiness, legal sufficiency, or official endorsement.
  - Do not infer that any output determines actual tax payable.
  - Do not infer use of taxpayer-level, firm-level, industry, ABS, ATO, DSS, Treasury, PBO, HILDA, or Census data.
  - Do not infer any firm-level CARSF liability change.
x_common_inputs:
  - &input_assumptions Independent review memo with assumptions challenged.
  - &input_trace Source-report trace from manifest entry to generated report.
  - &input_boundary Non-claim boundary check against the relevant report.
  - &input_blockers Calibration blocker list for the layer.
  - &input_no_validation External reviewer note separating challenge from validation.
x_common_questions:
  - &q_overclaim
    question_id: common_overclaim_boundary
    question: Could a reader overread this layer as more than a private prototype?
    attack_category: overclaiming_risk
    target_layers: [release_candidate_pack, executive_dashboard, legislative_architecture]
    target_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md, reports/legislative_architecture.md]
    why_it_matters: The release materials are broad enough to be quoted without the surrounding caveats.
    what_would_fail: Any wording that implies completed review, approval, validation, readiness, government endorsement, or legal adequacy.
    required_evidence_or_review: Red-team language review and explicit non-claim retention.
    severity_label: critical_blocker
    must_not_be_treated_as_validation: true
  - &q_calibration
    question_id: common_calibration_gap
    question: Are calibration blockers visible before numerical outputs are interpreted?
    attack_category: calibration_gap
    target_layers: [core_formula_model, sector_schedules, uncertainty_ranges, calibration_shell, real_data_feasibility]
    target_reports: [reports/example_results.md, reports/sector_schedule_expansion.md, reports/uncertainty_ranges.md, reports/calibration_requirements.md, reports/real_data_feasibility.md]
    why_it_matters: Placeholder values can look precise even when no external calibration has occurred.
    what_would_fail: Any report path where placeholders are easier to see than the missing calibration basis.
    required_evidence_or_review: Calibration-methods review, source-data plan, and blocker prominence review.
    severity_label: material_issue
    must_not_be_treated_as_validation: true
  - &q_real_data
    question_id: common_real_data_boundary
    question: Does any path imply taxpayer-level, firm-level, industry, welfare, or government data was used?
    attack_category: data_access_gap
    target_layers: [secure_ingestion, repo_guardrails, household_weighting, household_distributional, real_data_feasibility]
    target_reports: [reports/secure_ingestion_controls.md, reports/repo_guardrails.md, reports/household_weighting.md, reports/distributional_scenarios.md, reports/real_data_feasibility.md]
    why_it_matters: The repository must remain synthetic-only and data-free.
    what_would_fail: Any committed artefact that looks like real evidence, restricted data, or government microdata.
    required_evidence_or_review: Repository guardrail review, secure-ingestion review, and privacy review.
    severity_label: critical_blocker
    must_not_be_treated_as_validation: true
  - &q_false_precision
    question_id: common_false_precision
    question: Do ranges, bands, or matrices create false precision?
    attack_category: false_precision_gap
    target_layers: [sector_stress_matrix, behavioural_response, uncertainty_ranges, reviewed_scenarios]
    target_reports: [reports/sector_stress_matrix.md, reports/behavioural_response_simulation.md, reports/uncertainty_ranges.md, reports/reviewed_scenarios.md]
    why_it_matters: Deterministic bands and synthetic ranges are review aids only.
    what_would_fail: Any phrasing that turns placeholder bands into empirical findings, forecasts, or confidence claims.
    required_evidence_or_review: Statistical, economic, and red-team review of band language.
    severity_label: material_issue
    must_not_be_treated_as_validation: true
  - &q_manifest_drift
    question_id: common_manifest_drift
    question: Do manifests, reports, docs, runners, and CI steps refer to the same artefacts?
    attack_category: manifest_drift_gap
    target_layers: [executive_dashboard, release_candidate_pack, repo_guardrails]
    target_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md, reports/repo_guardrails.md]
    why_it_matters: Stale manifests make the release package misleading even when models are unchanged.
    what_would_fail: Any missing report, untracked runner, stale document path, or CI ordering mismatch.
    required_evidence_or_review: Technical manifest trace and CI review.
    severity_label: material_issue
    must_not_be_treated_as_validation: true
  - &q_power_boundary
    question_id: common_power_boundary
    question: Could evidence, workflow, or architecture language be mistaken for a real power or process?
    attack_category: administrative_power_gap
    target_layers: [administrative_workflow, legislative_architecture, evidence_workflow]
    target_reports: [reports/administrative_compliance_workflow.md, reports/legislative_architecture.md, reports/mock_evidence_workflow.md]
    why_it_matters: The prototype must not imply notices, penalties, powers, enforcement, or official administrative action.
    what_would_fail: Any path that reads like operative law, a statutory notice, enforcement step, penalty, or endorsed administrative process.
    required_evidence_or_review: Legal, ATO-methods, administrative-law, and Parliamentary Counsel review.
    severity_label: locked_until_external_review
    must_not_be_treated_as_validation: true
x_common_failures:
  - &f_overclaim
    failure_id: common_failure_overclaim
    failure_mode: Non-claim warnings are less prominent than prototype outputs.
    affected_layers: [release_candidate_pack, executive_dashboard]
    affected_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md]
    boundary_at_risk: Reader misinterpretation.
    required_follow_up: Increase warning prominence and add report-specific caveats.
    severity_label: material_issue
    not_a_finding_of_actual_error: true
  - &f_missing_blocker
    failure_id: common_failure_missing_blocker
    failure_mode: A report omits the blocker that controls interpretation.
    affected_layers: [calibration_shell, sector_schedules, uncertainty_ranges]
    affected_reports: [reports/calibration_requirements.md, reports/sector_schedule_expansion.md, reports/uncertainty_ranges.md]
    boundary_at_risk: Calibration gap.
    required_follow_up: Add blocker to the source manifest and generated report.
    severity_label: critical_blocker
    not_a_finding_of_actual_error: true
  - &f_stale_manifest
    failure_id: common_failure_stale_manifest
    failure_mode: Manifest and generated report indexes drift apart.
    affected_layers: [executive_dashboard, release_candidate_pack]
    affected_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md]
    boundary_at_risk: Manifest drift.
    required_follow_up: Regenerate reports and update manifest references.
    severity_label: material_issue
    not_a_finding_of_actual_error: true

