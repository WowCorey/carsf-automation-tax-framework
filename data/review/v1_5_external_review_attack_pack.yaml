review_tracks:
  - track_id: policy_review
    track_name: Policy Reviewer
    reviewer_type: policy_reviewer
    purpose: Attack policy framing, reader overread, public-language risk, equity gaps, and transition framing.
    inspect_first: [release/v1_5_rc/RELEASE_NOTES.md, release/v1_5_rc/REVIEWER_BRIEFING.md, reports/v1_5_release_candidate_pack.md]
    relevant_layers: [release_candidate_pack, executive_dashboard, working_paper, status_risks_docs, transition_funding, payment_interactions]
    relevant_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md, reports/transition_funding.md, reports/payment_interactions.md]
    core_attack_questions:
      - *q_overclaim
      - *q_calibration
      - *q_real_data
      - *q_false_precision
      - *q_manifest_drift
      - *q_power_boundary
      - question_id: policy_public_language
        question: Could public-facing language make the prototype sound like final policy design?
        attack_category: reader_misinterpretation_gap
        target_layers: [working_paper, release_candidate_pack]
        target_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md]
        why_it_matters: Reviewers need to see the prototype as critique-ready, not settled policy.
        what_would_fail: Language that suppresses uncertainty, blockers, or external-review needs.
        required_evidence_or_review: Policy and communications review of release material.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
      - question_id: policy_social_licence_gap
        question: Are social licence, equity, transition, and business-impact questions underdeveloped?
        attack_category: hidden_assumption_risk
        target_layers: [transition_funding, payment_interactions, household_distributional]
        target_reports: [reports/transition_funding.md, reports/payment_interactions.md, reports/distributional_scenarios.md]
        why_it_matters: A prototype can look coherent while omitting policy feasibility concerns.
        what_would_fail: Missing notes on distributional, business, or transition-design uncertainty.
        required_evidence_or_review: Policy review and stakeholder impact review outside this repo.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
      - question_id: policy_blocker_prominence
        question: Are calibration and review blockers visible enough in the reading path?
        attack_category: overclaiming_risk
        target_layers: [executive_dashboard, release_candidate_pack]
        target_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md]
        why_it_matters: Weak blocker prominence can make a prototype look more complete than it is.
        what_would_fail: A reader can reach outputs before seeing hard limitations.
        required_evidence_or_review: Navigation review and hostile-reader review.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
      - question_id: policy_coherence_overstatement
        question: Does the release pack overstate stack coherence across unrelated review layers?
        attack_category: hidden_assumption_risk
        target_layers: [release_candidate_pack, executive_dashboard]
        target_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md]
        why_it_matters: Consolidation can imply completion when it only shows navigation.
        what_would_fail: Missing caveats that layer consistency has not been externally reviewed.
        required_evidence_or_review: Independent policy synthesis review.
        severity_label: review_note
        must_not_be_treated_as_validation: true
    layer_attack_questions: [Attack reader-facing claim discipline, Attack calibration-blocker visibility, Attack transition and equity framing]
    report_attack_questions: [Can the report be quoted out of context, Does the report front-load caveats, Are blockers tied to reports]
    required_external_inputs: [*input_assumptions, *input_trace, *input_boundary, *input_blockers, *input_no_validation, social licence review, transition policy review, business-impact review, stakeholder challenge memo, equity framing review]
    failure_modes:
      - *f_overclaim
      - *f_missing_blocker
      - *f_stale_manifest
      - failure_id: policy_failure_final_design_tone
        failure_mode: Release text sounds like settled design rather than challenge material.
        affected_layers: [working_paper, release_candidate_pack]
        affected_reports: [reports/v1_5_release_candidate_pack.md, reports/executive_dashboard.md]
        boundary_at_risk: Reader overread.
        required_follow_up: Reframe as critique-ready and add stronger blockers.
        severity_label: material_issue
        not_a_finding_of_actual_error: true
      - failure_id: policy_failure_transition_gap
        failure_mode: Transition and equity constraints are not visible near fiscal or payment outputs.
        affected_layers: [transition_funding, payment_interactions, household_distributional]
        affected_reports: [reports/transition_funding.md, reports/payment_interactions.md, reports/distributional_scenarios.md]
        boundary_at_risk: Hidden assumption.
        required_follow_up: Add policy-risk cross-links and reviewer prompts.
        severity_label: material_issue
        not_a_finding_of_actual_error: true
    must_not_infer: *common_must_not
    locked_until_review_items: [public-facing policy claims, final policy design language, transition-policy feasibility, equity conclusions, stakeholder acceptability]
    recommended_output_format: Findings table with overclaim risk, missing policy evidence, required external review, and suggested wording change.
    non_claims: *common_non_claims

  - track_id: technical_review
    track_name: Technical Reviewer
    reviewer_type: technical_reviewer
    purpose: Attack manifests, runners, generated artefacts, CI coverage, fail-closed tests, and guardrail bypasses.
    inspect_first: [data/release/v1_5_release_manifest.yaml, data/dashboard/executive_dashboard_manifest.yaml, .github/workflows/ci.yml]
    relevant_layers: [repo_guardrails, executive_dashboard, release_candidate_pack, evidence_workflow, secure_ingestion, real_data_feasibility]
    relevant_reports: [reports/repo_guardrails.md, reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md, reports/secure_ingestion_controls.md, reports/real_data_feasibility.md]
    core_attack_questions:
      - *q_overclaim
      - *q_calibration
      - *q_real_data
      - *q_false_precision
      - *q_manifest_drift
      - *q_power_boundary
      - question_id: technical_ci_runner_gap
        question: Does CI run every report runner in the intended order?
        attack_category: guardrail_coverage_gap
        target_layers: [repo_guardrails, release_candidate_pack]
        target_reports: [reports/repo_guardrails.md, reports/v1_5_release_candidate_pack.md]
        why_it_matters: Generated artefacts can drift if a runner is outside CI.
        what_would_fail: Missing CI step or report runner after its dependencies.
        required_evidence_or_review: CI workflow trace and local runner reproduction.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
      - question_id: technical_fail_closed
        question: Do invalid manifests and report paths fail closed?
        attack_category: guardrail_coverage_gap
        target_layers: [executive_dashboard, release_candidate_pack, repo_guardrails]
        target_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md, reports/repo_guardrails.md]
        why_it_matters: A packaging layer should reject stale or missing references.
        what_would_fail: Mutated missing paths pass tests or runners.
        required_evidence_or_review: Negative tests for missing reports, layers, documents, and warnings.
        severity_label: critical_blocker
        must_not_be_treated_as_validation: true
      - question_id: technical_allowlist_scope
        question: Are guardrail allowlists too broad for release and attack-pack documents?
        attack_category: guardrail_coverage_gap
        target_layers: [repo_guardrails, secure_ingestion]
        target_reports: [reports/repo_guardrails.md, reports/secure_ingestion_controls.md]
        why_it_matters: Documentation allowlists can accidentally hide sensitive-marker misuse.
        what_would_fail: A non-document artefact can pass under a documentation exception.
        required_evidence_or_review: Guardrail fixture review and path allowlist review.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
      - question_id: technical_report_json_trace
        question: Does each Markdown report trace to its JSON payload and runner?
        attack_category: report_staleness_gap
        target_layers: [executive_dashboard, release_candidate_pack]
        target_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md]
        why_it_matters: A reviewer needs reproducible paths from source manifest to generated report.
        what_would_fail: Report text diverges from JSON or source manifest.
        required_evidence_or_review: Runner output diff and generated report trace.
        severity_label: material_issue
        must_not_be_treated_as_validation: true
    layer_attack_questions: [Attack manifest-reference drift, Attack CI runner coverage, Attack fail-closed behavior]
    report_attack_questions: [Does the Markdown match JSON, Is the runner in CI, Is the report regenerated]
    required_external_inputs: [*input_assumptions, *input_trace, *input_boundary, *input_blockers, *input_no_validation, CI run log, manifest diff review, guardrail fixture review, report regeneration trace]
    failure_modes:
      - *f_overclaim
      - *f_missing_blocker
      - *f_stale_manifest
      - failure_id: technical_failure_ci_gap
        failure_mode: New runner is absent from CI or ordered before its dependencies.
        affected_layers: [release_candidate_pack, repo_guardrails]
        affected_reports: [reports/v1_5_release_candidate_pack.md, reports/repo_guardrails.md]
        boundary_at_risk: Guardrail coverage.
        required_follow_up: Add CI step and ordering test.
        severity_label: critical_blocker
        not_a_finding_of_actual_error: true
      - failure_id: technical_failure_report_drift
        failure_mode: Report text and JSON payload disagree.
        affected_layers: [executive_dashboard, release_candidate_pack]
        affected_reports: [reports/executive_dashboard.md, reports/v1_5_release_candidate_pack.md]
        boundary_at_risk: Report staleness.
        required_follow_up: Regenerate and add stable test assertions.
        severity_label: material_issue
        not_a_finding_of_actual_error: true
    must_not_infer: *common_must_not
    locked_until_review_items: [CI coverage completeness, manifest drift controls, guardrail allowlists, generated-report traceability, fail-closed mutation coverage]
    recommended_output_format: Technical findings with file path, reproduction command, expected fail-closed behavior, and required test.
    non_claims: *common_non_claims

  - track_id: legal_review
    track_name: Legal Reviewer
    reviewer_type: legal_reviewer
    purpose: Attack legal overread, powers, safeguards, review placeholders, rights, obligations, penalties, and legal-sufficiency language.
    inspect_first: [reports/legislative_architecture.md, docs/legislative_architecture.md, release/v1_5_rc/NON_CLAIM_BOUNDARIES.md]
    relevant_layers: [legislative_architecture, administrative_workflow, evidence_workflow, release_candidate_pack]
    relevant_reports: [reports/legislative_architecture.md, reports/administrative_compliance_workflow.md, reports/mock_evidence_workflow.md, reports/v1_5_release_candidate_pack.md]
    core_attack_questions:
      - *q_overclaim
      - *q_calibration
      - *q_real_data
      - *q_false_precision
      - *q_manifest_drift
      - *q_power_boundary
      - question_id: legal_powers_overread
        question: Could evidence placeholders be read as powers, notices, or obligations?
        attack_category: legal_power_gap
        target_layers: [legislative_architecture, evidence_workflow, administrative_workflow]
        target_reports: [reports/legislative_architecture.md, reports/mock_evidence_workflow.md, reports/administrative_compliance_workflow.md]
        why_it_matters: The skeleton must stay non-operative and avoid legal effect.
        what_would_fail: Any provision placeholder that looks like a legal test, binding-sounding request, or obligation.
        required_evidence_or_review: Legal review, administrative-law review, and drafting counsel review.
        severity_label: locked_until_external_review
        must_not_be_treated_as_validation: true
      - question_id: legal_safeguard_gap
        question: Are review rights, reasons, privacy, secrecy, and administrative protections only placeholders?
        attack_category: legal_power_gap
        target_layers: [legislative_architecture, administrative_workflow]
        target_reports: [reports/legislative_architecture.md, reports/administrative_compliance_workflow.md]
        why_it_matters: Placeholder safeguards cannot be treated as real legal protections.
        what_would_fail: Any language suggesting real rights, appeals, objections, or statutory safeguards exist.
        required_evidence_or_review: Administrative-law and privacy/secrecy review.
        severity_label: critical_blocker
        must_not_be_treated_as_validation: true
      - question_id: legal_constitutional_gap
        question: Are constitutional and taxing-power assumptions explicitly unresolved?
        attack_category: legal_power_gap
        target_layers: [legislative_architecture, working_paper]
        target_reports: [reports/legislative_architecture.md, reports/v1_5_release_candidate_pack.md]
        why_it_matters: Architecture mapping is not constitutional analysis.
        what_would_fail: Any implication that constitutional review has occurred.
        required_evidence_or_review: External constitutional and tax-law review.
        severity_label: locked_until_external_review
        must_not_be_treated_as_validation: true
      - question_id: legal_drafting_boundary
        question: Does any text cross from architecture into operative drafting?
        attack_category: legal_power_gap
        target_layers: [legislative_architecture]
        target_reports: [reports/legislative_architecture.md]
        why_it_matters: Build 21 intentionally reserved operative drafting for counsel.
        what_would_fail: Mandatory wording, legal tests, rights, obligations, powers, penalties, or commencement effect.
        required_evidence_or_review: Parliamentary Counsel and legal drafting review.
        severity_label: locked_until_external_review
        must_not_be_treated_as_validation: true
    layer_attack_questions: [Attack power implication, Attack safeguard placeholders, Attack legal drafting boundary]
    report_attack_questions: [Does architecture read as law, Are rights placeholders clear, Are powers explicitly absent]
    required_external_inputs: [*input_assumptions, *input_trace, *input_boundary, *input_blockers, *input_no_validation, legal review, administrative-law review, constitutional review, Parliamentary Counsel review, privacy/secrecy legal review]
    failure_modes:
      - *f_overclaim
      - *f_missing_blocker
      - *f_stale_manifest
      - failure_id: legal_failure_operative_tone
        failure_mode: A placeholder reads like operative drafting.
        affected_layers: [legislative_architecture]
        affected_reports: [reports/legislative_architecture.md]
        boundary_at_risk: Legal power gap.
        required_follow_up: Rewrite as conceptual location only and lock for counsel review.
        severity_label: locked_until_external_review
        not_a_finding_of_actual_error: true
      - failure_id: legal_failure_safeguard_overread
        failure_mode: Safeguard placeholders could be mistaken for real review protections.
        affected_layers: [legislative_architecture, administrative_workflow]
