[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carsf-automation-tax-framework"
version = "0.1.0"
description = "Concept model and policy-paper prototype for CARSF."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pytest>=8.0",
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["model"]

[tool.pytest.ini_options]
pythonpath = ["model"]
testpaths = ["model/tests"]
addopts = "-q"
