  - scenario_id: token_oversight_workforce_wrapper
    scenario_name: Token oversight workforce wrapper
    sector_schedule_id: call_centres_customer_support
    response_type: token_human_oversight
    description: Synthetic pathway where nominal human escalation roles are wrapped around automated case resolution for review testing only.
    synthetic_triggers:
      - high automated resolution share with low substantive human case handling
      - escalation roles described as oversight rather than direct support work
    linked_avoidance_flags:
      - TOKEN_HUMAN_OVERSIGHT
      - FAKE_QLC_INFLATION
    linked_countermeasures:
      - evidence_requirement
      - grouped_entity_review
      - legal_policy_review
    placeholder_response_pressure: high
    requires_external_review: true
    non_claims:
      - This synthetic scenario does not predict taxpayer behaviour and does not modify firm-level CARSF liability.
    placeholder_basis:
      - synthetic call-centre support pathway

