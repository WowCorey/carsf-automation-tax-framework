schema_version: 0.1.0
status: prototype_schema
disclaimer: >
  This schema is a concept modelling aid only. It is not legislation, tax advice,
  Treasury guidance, ATO guidance, or a calibrated Australian schedule.
required_fields:
  - schedule_id
  - schedule_name
  - status
  - canonical_output_unit
  - calibration_status
  - confirmed_baseline_figures
  - measurement_scope
  - qlc
  - aii
  - opfte_libc_placeholder
  - frv
  - caps
  - safe_harbours
  - measurement_controls
  - avoidance_controls
  - placeholder_assumptions
  - data_required_for_real_calibration
field_notes:
  confirmed_baseline_figures: Must be sourced to official data.
  calibration_status: Must remain illustrative_placeholder_values_only until official calibration exists.
  measurement_scope: Must state that schedules are not calibrated and must not be used to estimate actual tax payable.
  placeholder_assumptions: May be used for examples but cannot be presented as real settings.
  data_required_for_real_calibration: Must identify the data or legal review still required.
