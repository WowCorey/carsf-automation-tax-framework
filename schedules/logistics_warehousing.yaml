safe_harbours:
  startup:
    placeholder_rule: Five years from incorporation or pre-revenue period, whichever ends first.
    anti_avoidance_note: Subject to aggregation and entity-splitting integrity rules.
  small_business:
    placeholder_rule: Simplified exemption below AUD 10m turnover unless grouped or high-scale autonomous production applies.
  cross_border_automation_notes:
    - Offshore dispatch, routing, optimisation, and warehouse-control services require related-party disclosure.
    - Australian-facing output is attributed by destination and activity, not server location or IP ownership alone.
data_required_for_real_calibration:
  - ATO, ABS, and industry data separating freight, last-mile delivery, warehousing, and platform dispatch.
  - State payroll tax exposure and regional employment concentration.
  - HILDA and DSS data on driver, picker, packer, dispatcher, and warehouse transition outcomes.
  - Autonomous vehicle kilometres, automated dispatch share, and warehouse robotics adoption data.
  - Transfer pricing, diverted profits tax, and significant global entity interaction analysis.
